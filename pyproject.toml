[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inlock"
version = "0.1.0"
description = "Firewall de aplicacao e gateway de acesso por QR Code para workloads Docker"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "qrcode>=8.2,<9",
  "pillow>=11,<13",
  "docker>=7.1,<8",
  "geoip2>=5,<6",
  "python-multipart>=0.0.20,<1",
  "lxml>=6,<7",
  "PyJWT[crypto]>=2.10,<3",
  "pyreact-framework>=1.0.5",
  "uikitpr>=0.3.2",
  "6cons>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1"]

[project.scripts]
inlock = "inlock.main:run"

[tool.setuptools.packages.find]
include = ["inlock*"]

[tool.setuptools.package-data]
inlock = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.prpm.scripts]
dev = "uvicorn inlock.main:app --reload --host 0.0.0.0 --port 14900"
serve = "uvicorn inlock.main:app --host 0.0.0.0 --port 14900"
test = "python -m pytest -q"
lint = "ruff check inlock tests"
